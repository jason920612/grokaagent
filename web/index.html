<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grokaagent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">grokaagent</div>
        <button type="button" id="sidebar-close" class="icon-btn" title="關閉側欄" aria-label="關閉側欄">✕</button>
      </div>
      <button type="button" id="new-chat" class="primary">＋ 新工作</button>
      <div id="sessions"></div>
    </aside>
    <div id="scrim" class="hidden" aria-hidden="true"></div>
    <main>
      <header id="header">
        <div id="header-left">
          <button type="button" id="menu-toggle" class="icon-btn" title="對話列表" aria-label="對話列表">☰</button>
          <div class="header-copy">
            <div id="brand">grokaagent</div>
            <div id="status-line"></div>
            <div id="meta-line"></div>
          </div>
        </div>
        <div id="header-right">
          <span id="provider-badge" class="badge hidden"></span>
          <button type="button" id="rail-toggle" class="ghost" title="工作詳情">工作詳情</button>
          <button type="button" id="task" class="ghost" title="任務模式">任務</button>
          <button type="button" id="gear" class="ghost" title="設定">設定</button>
        </div>
      </header>
      <div id="connection" role="status" aria-live="polite">連線中…</div>
      <section id="chat" aria-label="工作紀錄"></section>
      <button type="button" id="jump-bottom" class="hidden">↓ 回到最新進度</button>
      <div id="tray">
        <div id="queue"></div>
        <div id="pending"></div>
      </div>
      <footer id="composer-wrap">
        <div id="composer-shell">
          <div id="composer-bar">
            <button type="button" id="mode-queue" class="chip on" title="目前回覆完成後處理">接著做</button>
            <button type="button" id="mode-insert" class="chip" title="下一輪採用，不會撤回已執行的操作">調整目前工作</button>
            <button type="button" id="paste-image" class="chip">貼上圖片</button>
            <button type="button" id="interrupt" class="chip warn hidden">停止目前工作</button>
          </div>
          <textarea id="composer" rows="2" placeholder="輸入訊息… Enter 送出，Shift+Enter 換行"></textarea>
          <div class="composer-actions"><span id="delivery" role="status" aria-live="polite">草稿只保留在此分頁</span><button type="button" id="send-message">送出</button></div>
        </div>
      </footer>
    </main>
    <aside id="rail">
      <div class="rail-head">
        <h2>工作詳情</h2>
        <button type="button" id="rail-close" class="icon-btn" title="關閉" aria-label="關閉活動">✕</button>
      </div>
      <div id="work-summary"></div>
      <div id="rail-body"></div>
      <div id="file-changes"></div>
    </aside>
  </div>
  <div id="overlay" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
