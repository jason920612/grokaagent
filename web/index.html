<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grokaagent</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Pick the theme before the first paint: saved choice, else the system.
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("groka.theme") || "auto"; } catch (e) {}
      var light = pref === "light" || (pref === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.themePref = pref;
      document.documentElement.dataset.theme = light ? "light" : "dark";
    })();
  </script>
</head>
<body>
  <div id="app" class="side-open">
    <nav id="activity" aria-label="檢視">
      <button type="button" class="act" data-view="sessions" title="對話 (Alt+1)" aria-label="對話"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v10H9l-5 4z"/></svg></button>
      <button type="button" class="act" data-view="agents" title="代理 (Alt+2)" aria-label="代理"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M12 7.2v4.3M12 11.5L6.8 16M12 11.5l5.2 4.5"/></svg><span class="badge hidden"></span></button>
      <button type="button" class="act" data-view="changes" title="檔案變更 (Alt+3)" aria-label="檔案變更"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v12M6 16a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM18 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18 8c0 5-12 4-12 8"/></svg><span class="badge hidden"></span></button>
      <button type="button" class="act" data-view="background" title="背景工作 (Alt+4)" aria-label="背景工作"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg><span class="badge hidden"></span></button>
      <button type="button" class="act" data-view="task" title="任務 (Alt+5)" aria-label="任務"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="badge hidden"></span></button>
      <div class="spacer"></div>
      <button type="button" class="act" id="act-theme" title="主題：自動" aria-label="切換主題"><svg class="theme-icon ti-auto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><svg class="theme-icon ti-dark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="theme-icon ti-light" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" class="act" id="act-settings" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    </nav>
    <aside id="side" aria-label="側欄">
      <header id="side-title"></header>
      <div id="side-body"></div>
    </aside>
    <div id="side-scrim" class="hidden" aria-hidden="true"></div>
    <main id="editor">
      <div id="tabs" role="tablist" aria-label="分頁"></div>
      <div id="connection" role="status" aria-live="polite">連線中…</div>
      <div id="chat-wrap">
        <section id="chat" aria-label="工作紀錄"></section>
        <button type="button" id="jump-bottom" class="hidden">↓ 回到最新進度</button>
      </div>
      <div id="readonly" class="hidden" role="status"></div>
      <div id="tray">
        <div id="queue"></div>
        <div id="pending"></div>
      </div>
      <footer id="composer-wrap">
        <div id="composer-shell">
          <div id="composer-bar">
            <button type="button" id="mode-queue" class="chip on" title="目前回覆完成後處理">接著做</button>
            <button type="button" id="mode-insert" class="chip" title="下一輪採用，不會撤回已執行的操作">調整目前工作</button>
            <button type="button" id="paste-image" class="chip">貼上圖片</button>
            <button type="button" id="interrupt" class="chip warn hidden">停止目前工作</button>
          </div>
          <textarea id="composer" rows="2" placeholder="輸入訊息… Enter 送出，Shift+Enter 換行"></textarea>
          <div class="composer-actions"><span id="delivery" role="status" aria-live="polite">草稿只保留在此分頁</span><button type="button" id="send-message">送出</button></div>
        </div>
      </footer>
      <section id="panel" class="hidden" aria-label="面板">
        <div id="panel-head">
          <div id="panel-tabs" role="tablist"></div>
          <button type="button" id="panel-close" class="icon-btn" title="關閉面板 (Ctrl+J)" aria-label="關閉面板">✕</button>
        </div>
        <div id="panel-body"></div>
      </section>
    </main>
    <footer id="statusbar">
      <div id="status-left"></div>
      <div id="status-right"></div>
    </footer>
  </div>
  <div id="overlay" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
