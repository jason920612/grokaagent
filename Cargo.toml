[package]
name = "grokaagent"
version = "0.1.2-rc.2"
edition = "2021"
description = "Minimal agent kernel: event loop, tools, xAI Grok OAuth, JSONL event pipe"
license = "MIT"
repository = "https://github.com/jason920612/grokaagent"
readme = "README.md"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
rust-embed = "8"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.29"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
xcap = "0.7"
ratatui-image = { version = "8.0.2", default-features = false, features = ["crossterm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
